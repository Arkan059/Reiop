[package]
name = "reiop"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "reiop"
path = "src/main.rs"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Console",
    "Win32_System_Com",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Graphics_Gdi",
] }
winreg = "0.52"
sysinfo = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "2"
dialoguer = "0.11"
open = "5"
wmi = "0.15"
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }

[build-dependencies]
winres = "0.1"
